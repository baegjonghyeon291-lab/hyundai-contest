<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b4a63"/></marker>
  </defs>
  <rect width="1400" height="520" fill="#ffffff"/>
  <text x="700" y="44" text-anchor="middle" font-size="28" font-weight="700" fill="#0b1a2e">사용 흐름 — 골목 진입부터 사고 리포트까지</text>

  <g font-size="15" fill="#1f2d44">
    <!-- 1 -->
    <rect x="40" y="100" width="240" height="150" rx="14" fill="#eef3fa" stroke="#9fb3cc"/>
    <text x="160" y="128" text-anchor="middle" font-size="18" font-weight="700">① 진입 임박 (50m 전)</text>
    <text x="55" y="158">깜빡이 + 핸들 / 다음 회전 /</text>
    <text x="55" y="180">좁은 길·스쿨존 주의지점</text>
    <text x="55" y="212" fill="#3fa9f5" font-weight="700">🔊 "브레이크에 발을 올리고</text>
    <text x="55" y="234" fill="#3fa9f5" font-weight="700">30 이하로 준비하세요"</text>
    <!-- 2 -->
    <rect x="320" y="100" width="240" height="150" rx="14" fill="#fff7e6" stroke="#fbbf24"/>
    <text x="440" y="128" text-anchor="middle" font-size="18" font-weight="700">② 골목 모드</text>
    <text x="335" y="158">이면도로 · 기준 30 (스쿨존 20)</text>
    <text x="335" y="180">전조등·안개등 ON · 무드등 호박</text>
    <text x="335" y="202">창문 10% · 볼륨 ½ · 김서림 제거</text>
    <text x="335" y="234" fill="#b45309" font-weight="700">🔊 "골목길 진입. 30 이하로"</text>
    <!-- 3 -->
    <rect x="600" y="100" width="240" height="150" rx="14" fill="#fdecec" stroke="#f87171"/>
    <text x="720" y="128" text-anchor="middle" font-size="18" font-weight="700">③ 위험 경고</text>
    <text x="615" y="158">기준 초과 → 음성 + 무드등 적색</text>
    <text x="615" y="180">횡단보도·정류장·학교 앞 과속</text>
    <text x="615" y="202">급제동 핫스팟 접근</text>
    <text x="615" y="234" fill="#b91c1c" font-weight="700">🔊 "다른 운전자들이 7번 급제동"</text>
    <!-- 4 -->
    <rect x="880" y="100" width="240" height="150" rx="14" fill="#e8f7ee" stroke="#4ade80"/>
    <text x="1000" y="128" text-anchor="middle" font-size="18" font-weight="700">④ 골목 이탈</text>
    <text x="895" y="158">큰길 등급으로 복귀</text>
    <text x="895" y="180">조명·창문·볼륨 원래대로</text>
    <text x="895" y="202">골목 주행 기록은 일지에 저장</text>
    <text x="895" y="234" fill="#15803d" font-weight="700">🔊 "골목을 벗어났습니다"</text>
    <!-- 5 -->
    <rect x="1160" y="100" width="200" height="150" rx="14" fill="#eef3fa" stroke="#9fb3cc"/>
    <text x="1260" y="128" text-anchor="middle" font-size="18" font-weight="700">⑤ 기록</text>
    <text x="1175" y="158">상시 60초 버퍼</text>
    <text x="1175" y="180">주행 일지 30일</text>
    <text x="1175" y="202">맡김 모드 리포트</text>
    <text x="1175" y="224">벨트 안내 기록</text>
  </g>
  <g stroke="#3b4a63" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <path d="M280,175 L320,175"/><path d="M560,175 L600,175"/><path d="M840,175 L880,175"/><path d="M1120,175 L1160,175"/>
  </g>

  <!-- 사고 분기 -->
  <path d="M720,250 L720,300" stroke="#f87171" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <text x="740" y="285" font-size="14" fill="#b91c1c" font-weight="700">충격 2.5G / 에어백</text>
  <g font-size="15" fill="#1f2d44">
    <rect x="300" y="305" width="800" height="170" rx="14" fill="#0b1a2e"/>
    <text x="700" y="335" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">사고 발생 → 전 30초 · 후 10초 자동 저장 → 정차 후 "사고가 감지되었습니다"</text>
    <text x="320" y="368" fill="#c9d6e6">리포트: 충돌 속도 42 · 브레이크 1.6초 전 ✓ · 깜빡이 4초 전 ✓ · 전조등 ✓ · 왼쪽에서 충격</text>
    <text x="320" y="394" fill="#4ade80" font-weight="700">골목 모드 기준 30 · 충돌 시 28 → 준수 ✓ · 충돌 12초 전 음성 안내 수신 ✓ · 자동 점등 ✓</text>
    <text x="320" y="424" fill="#c9d6e6">버튼: 🚨 보험사 전화 · 112 · 📍 위치 복사 · 📱 QR로 휴대폰 리포트 (지도·그래프·PDF)</text>
    <text x="320" y="452" fill="#8a9bb4">블랙박스 영상이 "무엇이 일어났나"라면, 이 리포트는 "운전자가 피할 수 있었나"에 답한다</text>
  </g>
</svg>
